<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت جلسات هفتگی</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vazirmatn Font CDN -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Moment Persian CDN -->
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment-jalaali@0.9.2/build/moment-jalaali.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Vazirmatn', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f3ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'scale(0.98)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(16px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #cbd5e1;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.12) 0px, transparent 50%);
            color: #0f172a;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(203, 213, 225, 0.8);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
            transition: all 0.25s ease;
        }

        .glass-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -3px rgba(79, 70, 229, 0.12);
            border-color: #818cf8;
        }

        /* Neon Rotating Border Effect for Today */
        @keyframes rotateBorder {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .today-card {
            position: relative;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 1.5rem;
            z-index: 1;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.25);
        }

        .today-card::before {
            content: '';
            position: absolute;
            z-index: -2;
            left: -50%;
            top: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent 0 300deg, #6366f1 330deg, #ec4899 360deg);
            animation: rotateBorder 4s linear infinite;
        }

        .today-card::after {
            content: '';
            position: absolute;
            z-index: -1;
            inset: 3px;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(12px);
            border-radius: 1.3rem;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative selection:bg-brand-500 selection:text-white">

    <!-- Header Section -->
    <header class="glass-panel sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-brand-500/20">
                    <i class="fa-solid fa-calendar-week text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-extrabold text-slate-800">
                        برنامه‌ریزی جلسات هفتگی
                    </h1>
                    <p class="text-xs text-slate-500 hidden sm:block font-medium">مدیریت منظم برنامه‌ها و زمان‌بندی جلسات</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="openModal()" class="flex items-center gap-2 bg-brand-600 hover:bg-brand-700 text-white px-5 py-2.5 rounded-2xl font-semibold text-sm transition shadow-md shadow-brand-600/20 active:scale-95">
                    <i class="fa-solid fa-plus text-base"></i>
                    <span class="hidden sm:inline">جلسه جدید</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full z-10">
        
        <!-- Week Navigator & Search -->
        <div class="mb-6 flex flex-col md:flex-row items-center justify-between gap-4 glass-panel p-4 rounded-3xl shadow-sm">
            
            <!-- Week Navigation Controls -->
            <div class="flex items-center gap-2 w-full md:w-auto justify-between md:justify-start">
                <button onclick="changeWeek(-1)" class="p-2.5 rounded-2xl bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 transition active:scale-95 shadow-sm flex items-center gap-1.5 text-xs font-semibold">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                    <span>هفته قبل</span>
                </button>

                <div class="text-center px-3">
                    <div id="weekRangeLabel" class="font-bold text-sm sm:text-base text-slate-800"></div>
                    <button onclick="goToCurrentWeek()" class="text-[11px] text-brand-600 hover:text-brand-700 font-semibold underline mt-0.5">
                        رفتن به هفته جاری
                    </button>
                </div>

                <button onclick="changeWeek(1)" class="p-2.5 rounded-2xl bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 transition active:scale-95 shadow-sm flex items-center gap-1.5 text-xs font-semibold">
                    <span>هفته بعد</span>
                    <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>
            </div>

            <!-- Search Input & Priority Filter -->
            <div class="flex items-center gap-3 w-full md:w-auto">
                <div class="relative w-full md:w-72">
                    <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="searchInput" oninput="renderMeetings()" placeholder="جستجو در جلسات..." 
                           class="w-full pl-3 pr-10 py-2.5 bg-white border border-slate-200 rounded-2xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition placeholder:text-slate-400 shadow-sm">
                </div>

                <span id="totalMeetingsBadge" class="bg-brand-50 text-brand-700 px-3 py-2 rounded-2xl text-xs font-bold border border-brand-100 whitespace-nowrap shadow-sm">
                    جلسات هفته: ۰
                </span>
            </div>
        </div>

        <!-- Weekly Days Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-7 gap-4">
            
            <!-- Saturday -->
            <div class="day-column glass-panel rounded-3xl p-3.5 flex flex-col transition border-t-4 border-t-blue-500" data-day="شنبه">
                <div class="pb-2.5 mb-2.5 border-b border-slate-200">
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-slate-800">شنبه</span>
                        <span class="day-count text-xs font-bold bg-slate-200/80 px-2 py-0.5 rounded-xl text-slate-700">۰</span>
                    </div>
                    <div class="day-date-label text-[11px] text-slate-500 mt-1 font-medium"></div>
                </div>
                <div class="meetings-list space-y-3 flex-1 min-h-[140px]" id="list-شنبه"></div>
                <button onclick="openModalForDay('شنبه')" class="mt-2 w-full py-1.5 text-xs font-semibold text-brand-600 hover:bg-brand-50 rounded-xl transition flex items-center justify-center gap-1">
                    <i class="fa-solid fa-plus"></i> ثبت جلسه
                </button>
            </div>

            <!-- Sunday -->
            <div class="day-column glass-panel rounded-3xl p-3.5 flex flex-col transition border-t-4 border-t-indigo-500" data-day="یکشنبه">
                <div class="pb-2.5 mb-2.5 border-b border-slate-200">
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-slate-800">یکشنبه</span>
                        <span class="day-count text-xs font-bold bg-slate-200/80 px-2 py-0.5 rounded-xl text-slate-700">۰</span>
                    </div>
                    <div class="day-date-label text-[11px] text-slate-500 mt-1 font-medium"></div>
                </div>
                <div class="meetings-list space-y-3 flex-1 min-h-[140px]" id="list-یکشنبه"></div>
                <button onclick="openModalForDay('یکشنبه')" class="mt-2 w-full py-1.5 text-xs font-semibold text-brand-600 hover:bg-brand-50 rounded-xl transition flex items-center justify-center gap-1">
                    <i class="fa-solid fa-plus"></i> ثبت جلسه
                </button>
            </div>

            <!-- Monday -->
            <div class="day-column glass-panel rounded-3xl p-3.5 flex flex-col transition border-t-4 border-t-purple-500" data-day="دوشنبه">
                <div class="pb-2.5 mb-2.5 border-b border-slate-200">
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-slate-800">دوشنبه</span>
                        <span class="day-count text-xs font-bold bg-slate-200/80 px-2 py-0.5 rounded-xl text-slate-700">۰</span>
                    </div>
                    <div class="day-date-label text-[11px] text-slate-500 mt-1 font-medium"></div>
                </div>
                <div class="meetings-list space-y-3 flex-1 min-h-[140px]" id="list-دوشنبه"></div>
                <button onclick="openModalForDay('دوشنبه')" class="mt-2 w-full py-1.5 text-xs font-semibold text-brand-600 hover:bg-brand-50 rounded-xl transition flex items-center justify-center gap-1">
                    <i class="fa-solid fa-plus"></i> ثبت جلسه
                </button>
            </div>

            <!-- Tuesday -->
            <div class="day-column glass-panel rounded-3xl p-3.5 flex flex-col transition border-t-4 border-t-amber-500" data-day="سه‌شنبه">
                <div class="pb-2.5 mb-2.5 border-b border-slate-200">
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-slate-800">سه‌شنبه</span>
                        <span class="day-count text-xs font-bold bg-slate-200/80 px-2 py-0.5 rounded-xl text-slate-700">۰</span>
                    </div>
                    <div class="day-date-label text-[11px] text-slate-500 mt-1 font-medium"></div>
                </div>
                <div class="meetings-list space-y-3 flex-1 min-h-[140px]" id="list-سه‌شنبه"></div>
                <button onclick="openModalForDay('سه‌شنبه')" class="mt-2 w-full py-1.5 text-xs font-semibold text-brand-600 hover:bg-brand-50 rounded-xl transition flex items-center justify-center gap-1">
                    <i class="fa-solid fa-plus"></i> ثبت جلسه
                </button>
            </div>

            <!-- Wednesday -->
            <div class="day-column glass-panel rounded-3xl p-3.5 flex flex-col transition border-t-4 border-t-teal-500" data-day="چهارشنبه">
                <div class="pb-2.5 mb-2.5 border-b border-slate-200">
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-slate-800">چهارشنبه</span>
                        <span class="day-count text-xs font-bold bg-slate-200/80 px-2 py-0.5 rounded-xl text-slate-700">۰</span>
                    </div>
                    <div class="day-date-label text-[11px] text-slate-500 mt-1 font-medium"></div>
                </div>
                <div class="meetings-list space-y-3 flex-1 min-h-[140px]" id="list-چهارشنبه"></div>
                <button onclick="openModalForDay('چهارشنبه')" class="mt-2 w-full py-1.5 text-xs font-semibold text-brand-600 hover:bg-brand-50 rounded-xl transition flex items-center justify-center gap-1">
                    <i class="fa-solid fa-plus"></i> ثبت جلسه
                </button>
            </div>

            <!-- Thursday -->
            <div class="day-column glass-panel rounded-3xl p-3.5 flex flex-col transition border-t-4 border-t-emerald-500" data-day="پنج‌شنبه">
                <div class="pb-2.5 mb-2.5 border-b border-slate-200">
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-slate-800">پنج‌شنبه</span>
                        <span class="day-count text-xs font-bold bg-slate-200/80 px-2 py-0.5 rounded-xl text-slate-700">۰</span>
                    </div>
                    <div class="day-date-label text-[11px] text-slate-500 mt-1 font-medium"></div>
                </div>
                <div class="meetings-list space-y-3 flex-1 min-h-[140px]" id="list-پنج‌شنبه"></div>
                <button onclick="openModalForDay('پنج‌شنبه')" class="mt-2 w-full py-1.5 text-xs font-semibold text-brand-600 hover:bg-brand-50 rounded-xl transition flex items-center justify-center gap-1">
                    <i class="fa-solid fa-plus"></i> ثبت جلسه
                </button>
            </div>

            <!-- Friday -->
            <div class="day-column glass-panel rounded-3xl p-3.5 flex flex-col transition border-t-4 border-t-rose-500 bg-rose-50/20" data-day="جمعه">
                <div class="pb-2.5 mb-2.5 border-b border-rose-200">
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-rose-700">جمعه</span>
                        <span class="day-count text-xs font-bold bg-rose-100 px-2 py-0.5 rounded-xl text-rose-700">۰</span>
                    </div>
                    <div class="day-date-label text-[11px] text-rose-500 mt-1 font-medium"></div>
                </div>
                <div class="meetings-list space-y-3 flex-1 min-h-[140px]" id="list-جمعه"></div>
                <button onclick="openModalForDay('جمعه')" class="mt-2 w-full py-1.5 text-xs font-semibold text-rose-600 hover:bg-rose-100/50 rounded-xl transition flex items-center justify-center gap-1">
                    <i class="fa-solid fa-plus"></i> ثبت جلسه
                </button>
            </div>
        </div>
    </main>

    <!-- Floating Action Button (FAB) for Mobile -->
    <button onclick="openModal()" class="sm:hidden fixed bottom-6 left-6 z-40 w-14 h-14 rounded-full bg-brand-600 text-white flex items-center justify-center shadow-lg shadow-brand-600/30 active:scale-95 transition">
        <i class="fa-solid fa-plus text-2xl"></i>
    </button>

    <!-- Modal Form (Add / Edit Meeting) -->
    <div id="meetingModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm transition-opacity duration-200">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden border border-slate-100 animate-slide-up">
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-xl bg-brand-100 text-brand-600 flex items-center justify-center">
                        <i class="fa-solid fa-calendar-plus text-sm"></i>
                    </div>
                    <h3 id="modalTitle" class="text-base font-bold text-slate-800">افزودن جلسه جدید</h3>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-xl hover:bg-slate-100 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <!-- Modal Form -->
            <form id="meetingForm" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4">
                <input type="hidden" id="meetingId">

                <!-- Title -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">عنوان جلسه *</label>
                    <input type="text" id="titleInput" required placeholder="مثلاً: جلسه هم‌آفرینی محصول" 
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition">
                </div>

                <!-- Day of Week & Category -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">روز هفته *</label>
                        <select id="dayInput" onchange="autoFillDateByDay()" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition">
                            <option value="شنبه">شنبه</option>
                            <option value="یکشنبه">یکشنبه</option>
                            <option value="دوشنبه">دوشنبه</option>
                            <option value="سه‌شنبه">سه‌شنبه</option>
                            <option value="چهارشنبه">چهارشنبه</option>
                            <option value="پنج‌شنبه">پنج‌شنبه</option>
                            <option value="جمعه">جمعه</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">نوع جلسه *</label>
                        <select id="categoryInput" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition">
                            <option value="in-person">حضوری</option>
                            <option value="online">آنلاین</option>
                            <option value="urgent">ضروری</option>
                        </select>
                    </div>
                </div>

                <!-- Date Selection & Week Navigation Buttons -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">تاریخ جلسه (شمسی)</label>
                    <div class="flex flex-col sm:flex-row gap-2">
                        <input type="text" id="dateInput" placeholder="۱۴۰۳/۰۸/۱۵" required
                               class="flex-1 px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition">
                        <div class="flex gap-1.5">
                            <button type="button" onclick="shiftDateDays(-7)" class="flex-1 sm:flex-none px-3 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 border border-slate-200 whitespace-nowrap active:scale-95">
                                <i class="fa-solid fa-backward text-[10px]"></i>
                                <span>هفته قبل</span>
                            </button>
                            <button type="button" onclick="shiftDateDays(7)" class="flex-1 sm:flex-none px-3 py-2.5 bg-indigo-50 hover:bg-indigo-100 text-brand-700 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 border border-indigo-100 whitespace-nowrap active:scale-95">
                                <span>هفته بعد</span>
                                <i class="fa-solid fa-forward text-[10px]"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Separate Hours & Minutes Controls -->
                <div class="grid grid-cols-2 gap-4">
                    <!-- Start Time (Hour & Minute) -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">ساعت شروع *</label>
                        <div class="flex items-center gap-1.5">
                            <select id="startHour" required class="w-1/2 px-2 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-center focus:outline-none focus:ring-2 focus:ring-brand-500">
                            </select>
                            <span class="font-bold text-slate-400">:</span>
                            <select id="startMin" required class="w-1/2 px-2 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-center focus:outline-none focus:ring-2 focus:ring-brand-500">
                            </select>
                        </div>
                    </div>

                    <!-- End Time (Hour & Minute) -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">ساعت پایان *</label>
                        <div class="flex items-center gap-1.5">
                            <select id="endHour" required class="w-1/2 px-2 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-center focus:outline-none focus:ring-2 focus:ring-brand-500">
                            </select>
                            <span class="font-bold text-slate-400">:</span>
                            <select id="endMin" required class="w-1/2 px-2 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-center focus:outline-none focus:ring-2 focus:ring-brand-500">
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Location -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">مکان / لینک جلسه *</label>
                    <input type="text" id="locationInput" required placeholder="اتاق جلسه 2 یا لینک اسکای‌روم/گوگل‌میت" 
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition">
                </div>

                <!-- Description -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">توضیحات تکمیلی</label>
                    <textarea id="descriptionInput" rows="2" placeholder="دستور جلسه یا یادداشت‌ها..." 
                              class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition resize-none"></textarea>
                </div>

                <!-- Actions -->
                <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-100">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition">
                        انصراف
                    </button>
                    <button type="submit" class="px-6 py-2.5 text-sm font-semibold bg-brand-600 hover:bg-brand-700 text-white rounded-xl shadow-md shadow-brand-600/20 transition active:scale-95">
                        ذخیره جلسه
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 hidden bg-slate-800 text-white px-5 py-3 rounded-2xl shadow-xl text-sm flex items-center gap-3 transition animate-slide-up">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span id="toastMessage">عملیات با موفقیت انجام شد</span>
    </div>

    <!-- Footer -->
    <footer class="glass-panel mt-12 py-4 text-center text-xs text-slate-500 z-10 border-t border-slate-200">
        سیستم برنامه‌ریزی جلسات هفتگی | آماده انتشار در GitHub Pages
    </footer>

    <!-- Script Logic -->
    <script>
        let meetings = [];
        let currentWeekOffset = 0; // 0 = Current week
        const DAYS = ['شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنج‌شنبه', 'جمعه'];

        // Initial setup
        window.addEventListener('DOMContentLoaded', () => {
            initTimeSelectOptions();
            loadMeetings();
            renderWeekView();
        });

        function loadMeetings() {
            try {
                const data = localStorage.getItem('weekly_meetings_data');
                meetings = data ? JSON.parse(data) : [];
            } catch (e) {
                meetings = [];
            }
        }

        function saveMeetings() {
            try {
                localStorage.setItem('weekly_meetings_data', JSON.stringify(meetings));
            } catch (e) {
                console.error("Failed to save to localStorage", e);
            }
        }

        // Initialize Hour & Minute dropdown options
        function initTimeSelectOptions() {
            const startHour = document.getElementById('startHour');
            const endHour = document.getElementById('endHour');
            const startMin = document.getElementById('startMin');
            const endMin = document.getElementById('endMin');

            startHour.innerHTML = '';
            endHour.innerHTML = '';
            startMin.innerHTML = '';
            endMin.innerHTML = '';

            for (let i = 0; i < 24; i++) {
                const val = i.toString().padStart(2, '0');
                const pVal = toPersianDigits(val);
                startHour.add(new Option(pVal, val));
                endHour.add(new Option(pVal, val));
            }

            for (let i = 0; i < 60; i += 5) {
                const val = i.toString().padStart(2, '0');
                const pVal = toPersianDigits(val);
                startMin.add(new Option(pVal, val));
                endMin.add(new Option(pVal, val));
            }

            startHour.value = '09';
            startMin.value = '00';
            endHour.value = '10';
            endMin.value = '00';
        }

        // Get Saturday moment of the target week offset
        function getSaturdayOfWeek(offset = 0) {
            let m = moment();
            m.add(offset, 'weeks');
            let dayOfWeek = m.day(); // 0: Sun, 1: Mon, ..., 6: Sat
            let distToSat = (dayOfWeek === 6) ? 0 : (dayOfWeek + 1);
            m.subtract(distToSat, 'days');
            return m;
        }

        // Navigation Controls
        function changeWeek(delta) {
            currentWeekOffset += delta;
            renderWeekView();
        }

        function goToCurrentWeek() {
            currentWeekOffset = 0;
            renderWeekView();
        }

        // Render Week View
        function renderWeekView() {
            const satMoment = getSaturdayOfWeek(currentWeekOffset);
            const friMoment = satMoment.clone().add(6, 'days');

            const satStr = toPersianDigits(satMoment.format('jD jMMMM'));
            const friStr = toPersianDigits(friMoment.format('jD jMMMM jYYYY'));
            document.getElementById('weekRangeLabel').textContent = `${satStr} تا ${friStr}`;

            DAYS.forEach((dayName, index) => {
                const dayMoment = satMoment.clone().add(index, 'days');
                const col = document.querySelector(`[data-day="${dayName}"]`);
                if (col) {
                    const dateLabel = col.querySelector('.day-date-label');
                    if (dateLabel) {
                        dateLabel.textContent = toPersianDigits(dayMoment.format('jD jMMMM jYYYY'));
                    }

                    if (dayMoment.isSame(moment(), 'day')) {
                        col.classList.add('today-card');
                    } else {
                        col.classList.remove('today-card');
                    }
                }
            });

            renderMeetings();
        }

        // Render Cards inside each Day Column
        function renderMeetings() {
            const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
            const satMoment = getSaturdayOfWeek(currentWeekOffset);
            let weekMeetingCount = 0;

            DAYS.forEach((dayName, index) => {
                const dayMoment = satMoment.clone().add(index, 'days');
                const dayDateStr = toPersianDigits(dayMoment.format('jYYYY/jMM/jDD'));
                const listContainer = document.getElementById(`list-${dayName}`);
                const dayColumn = document.querySelector(`[data-day="${dayName}"]`);
                
                if (!listContainer) return;

                // Filter meetings for this specific day/date
                const dayMeetings = meetings.filter(m => {
                    const matchesDayOrDate = (m.day === dayName) || (m.date === dayDateStr);
                    const matchesSearch = !searchTerm || 
                        m.title.toLowerCase().includes(searchTerm) || 
                        m.location.toLowerCase().includes(searchTerm) || 
                        (m.description && m.description.toLowerCase().includes(searchTerm));
                    return matchesDayOrDate && matchesSearch;
                });

                weekMeetingCount += dayMeetings.length;

                // Update badge count
                if (dayColumn) {
                    const countBadge = dayColumn.querySelector('.day-count');
                    if (countBadge) countBadge.textContent = toPersianDigits(dayMeetings.length);
                }

                // Render cards HTML
                if (dayMeetings.length === 0) {
                    listContainer.innerHTML = `
                        <div class="h-28 flex flex-col items-center justify-center text-slate-400 border-2 border-dashed border-slate-200/80 rounded-2xl p-2 text-center">
                            <i class="fa-regular fa-calendar-xmark text-lg mb-1 opacity-60"></i>
                            <span class="text-[11px] font-medium">جلسه‌ای ثبت نشده</span>
                        </div>
                    `;
                } else {
                    listContainer.innerHTML = dayMeetings.map(m => {
                        const catBadge = getCategoryTag(m.category);
                        return `
                            <div class="glass-card rounded-2xl p-3 relative group">
                                <div class="flex items-start justify-between gap-2 mb-1.5">
                                    <h4 class="font-bold text-xs text-slate-800 leading-snug line-clamp-2">${escapeHtml(m.title)}</h4>
                                    <span class="${catBadge.bg} ${catBadge.color} text-[10px] px-2 py-0.5 rounded-lg font-bold whitespace-nowrap">
                                        ${catBadge.label}
                                    </span>
                                </div>
                                
                                <div class="text-[11px] text-slate-600 flex items-center gap-1.5 mb-1 font-medium">
                                    <i class="fa-regular fa-clock text-brand-500 text-xs"></i>
                                    <span>${toPersianDigits(m.startTime)} تا ${toPersianDigits(m.endTime)}</span>
                                </div>

                                <div class="text-[11px] text-slate-500 flex items-center gap-1.5 truncate mb-2">
                                    <i class="fa-solid fa-location-dot text-rose-500 text-xs"></i>
                                    <span class="truncate">${escapeHtml(m.location)}</span>
                                </div>

                                ${m.description ? `
                                    <p class="text-[10px] text-slate-500 bg-slate-100/70 p-1.5 rounded-xl mb-2 line-clamp-2">
                                        ${escapeHtml(m.description)}
                                    </p>
                                ` : ''}

                                <div class="flex items-center justify-end gap-1 pt-1 border-t border-slate-100 opacity-90 group-hover:opacity-100">
                                    <button onclick="editMeeting('${m.id}')" class="p-1 text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-lg transition" title="ویرایش">
                                        <i class="fa-solid fa-pen-to-square text-xs"></i>
                                    </button>
                                    <button onclick="deleteMeeting('${m.id}')" class="p-1 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition" title="حذف">
                                        <i class="fa-solid fa-trash-can text-xs"></i>
                                    </button>
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            });

            document.getElementById('totalMeetingsBadge').textContent = `جلسات هفته: ${toPersianDigits(weekMeetingCount)}`;
        }

        function getCategoryTag(category) {
            switch (category) {
                case 'online':
                    return { label: 'آنلاین', bg: 'bg-emerald-100', color: 'text-emerald-700' };
                case 'urgent':
                    return { label: 'ضروری', bg: 'bg-rose-100', color: 'text-rose-700' };
                default:
                    return { label: 'حضوری', bg: 'bg-indigo-100', color: 'text-indigo-700' };
            }
        }

        // Auto-fill date based on selected day of the week
        function autoFillDateByDay() {
            const selectedDay = document.getElementById('dayInput').value;
            const dayIndex = DAYS.indexOf(selectedDay);
            if (dayIndex !== -1) {
                const satMoment = getSaturdayOfWeek(currentWeekOffset);
                const targetMoment = satMoment.clone().add(dayIndex, 'days');
                document.getElementById('dateInput').value = toPersianDigits(targetMoment.format('jYYYY/jMM/jDD'));
            }
        }

        // Shift Date by Days (+7 or -7)
        function shiftDateDays(daysCount) {
            const dateInput = document.getElementById('dateInput');
            let currentVal = toEnglishDigits(dateInput.value.trim());

            let m = moment(currentVal, 'jYYYY/jMM/jDD');
            if (m.isValid()) {
                m.add(daysCount, 'days');
                dateInput.value = toPersianDigits(m.format('jYYYY/jMM/jDD'));
            } else {
                autoFillDateByDay();
            }
        }

        // Modal Functions
        function openModal(isEdit = false) {
            const modal = document.getElementById('meetingModal');
            document.getElementById('modalTitle').textContent = isEdit ? 'ویرایش جلسه' : 'افزودن جلسه جدید';
            if (!isEdit) {
                document.getElementById('meetingForm').reset();
                document.getElementById('meetingId').value = '';
                document.getElementById('startHour').value = '09';
                document.getElementById('startMin').value = '00';
                document.getElementById('endHour').value = '10';
                document.getElementById('endMin').value = '00';
                autoFillDateByDay();
            }
            modal.classList.remove('hidden');
        }

        function openModalForDay(dayName) {
            document.getElementById('dayInput').value = dayName;
            autoFillDateByDay();
            openModal(true);
            document.getElementById('modalTitle').textContent = `افزودن جلسه (${dayName})`;
        }

        function closeModal() {
            document.getElementById('meetingModal').classList.add('hidden');
        }

        // Form Submission Handler
        function handleFormSubmit(e) {
            e.preventDefault();

            const id = document.getElementById('meetingId').value;
            const title = document.getElementById('titleInput').value.trim();
            const day = document.getElementById('dayInput').value;
            const category = document.getElementById('categoryInput').value;
            const date = document.getElementById('dateInput').value.trim();
            
            const startH = document.getElementById('startHour').value;
            const startM = document.getElementById('startMin').value;
            const endH = document.getElementById('endHour').value;
            const endM = document.getElementById('endMin').value;

            const startTime = `${startH}:${startM}`;
            const endTime = `${endH}:${endM}`;
            const location = document.getElementById('locationInput').value.trim();
            const description = document.getElementById('descriptionInput').value.trim();

            if (id) {
                const index = meetings.findIndex(m => m.id === id);
                if (index !== -1) {
                    meetings[index] = { id, title, day, category, date, startTime, endTime, location, description };
                    showToast('جلسه ویرایش شد');
                }
            } else {
                const newMeeting = {
                    id: Date.now().toString(),
                    title,
                    day,
                    category,
                    date,
                    startTime,
                    endTime,
                    location,
                    description
                };
                meetings.push(newMeeting);
                showToast('جلسه با موفقیت ثبت شد');
            }

            saveMeetings();
            renderMeetings();
            closeModal();
        }

        function editMeeting(id) {
            const meeting = meetings.find(m => m.id === id);
            if (!meeting) return;

            document.getElementById('meetingId').value = meeting.id;
            document.getElementById('titleInput').value = meeting.title;
            document.getElementById('dayInput').value = meeting.day;
            document.getElementById('categoryInput').value = meeting.category || 'in-person';
            document.getElementById('dateInput').value = meeting.date || '';

            const [sH, sM] = (meeting.startTime || '09:00').split(':');
            const [eH, eM] = (meeting.endTime || '10:00').split(':');

            document.getElementById('startHour').value = sH || '09';
            document.getElementById('startMin').value = sM || '00';
            document.getElementById('endHour').value = eH || '10';
            document.getElementById('endMin').value = eM || '00';

            document.getElementById('locationInput').value = meeting.location;
            document.getElementById('descriptionInput').value = meeting.description || '';

            openModal(true);
        }

        function deleteMeeting(id) {
            meetings = meetings.filter(m => m.id !== id);
            saveMeetings();
            renderMeetings();
            showToast('جلسه حذف شد', 'rose');
        }

        // Helper functions
        function toPersianDigits(str) {
            if (!str) return '';
            return str.toString().replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
        }

        function toEnglishDigits(str) {
            if (!str) return '';
            return str.toString().replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        function showToast(message, type = 'emerald') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMessage.textContent = message;
            toastIcon.className = type === 'rose' 
                ? 'fa-solid fa-circle-exclamation text-rose-400 text-lg' 
                : 'fa-solid fa-circle-check text-emerald-400 text-lg';

            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 2500);
        }
    </script>
</body>
</html>
